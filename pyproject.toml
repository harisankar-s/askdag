[project]
name = "asklineage"
version = "0.1.0"
description = "Ask your data platform: lineage, ownership and incident answers for dbt projects."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.8",
    "psycopg[binary,pool]>=3.2",
    "pyyaml>=6.0.4",
    "openai>=3.57.0",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
]

[project.scripts]
asklineage = "asklineage.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
