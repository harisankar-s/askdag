version: 2

models:
  - name: stg_app__orders
    description: Orders from the app, renamed and typed.
    columns:
      - name: order_id
        description: Order key.
        data_tests: [unique, not_null]
      - name: customer_id
      - name: ordered_at
      - name: status
      - name: is_test
  - name: stg_app__customers
    description: Customer accounts from the app, renamed and typed.
    columns:
      - name: customer_id
        description: Customer key.
        data_tests: [unique, not_null]
      - name: email
      - name: country_code
      - name: signed_up_at
  - name: stg_app__payments
    description: Payment attempts, with amounts in dollars.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: order_id
      - name: amount
        description: Payment amount in dollars.
      - name: method
      - name: payment_status
