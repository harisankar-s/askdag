name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: asklineage
          POSTGRES_PASSWORD: asklineage
          POSTGRES_DB: asklineage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asklineage -d asklineage"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://asklineage:asklineage@localhost:5432/asklineage
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # The lineage promise on manifests dbt wrote, not only the synthetic one (ADR 0024).
      - name: Lineage conformance on the shop manifests
        run: |
          uv run asklineage init-db
          for manifest in examples/shop/manifests/manifest.v1.json examples/shop/manifests/manifest.json; do
            uv run asklineage load-manifest "$manifest"
            uv run asklineage eval conformance "$manifest"
          done

  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/smoke_quickstart.sh
      - if: always()
        run: docker compose down -v
