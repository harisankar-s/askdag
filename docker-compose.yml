services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: asklineage
      POSTGRES_PASSWORD: asklineage
      POSTGRES_DB: asklineage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asklineage -d asklineage"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
