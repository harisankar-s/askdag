  - id: n03
    category: unanswerable
    question: Do we keep rider complaint tickets anywhere?
    expected: []
  - id: n04
    category: unanswerable
    question: Which model tracks airport flight delays?
    expected: []
  - id: n05
    category: unanswerable
    question: How much carbon does each bus emit?
    expected: []
    notes: near miss; the fuel and energy tables are close but hold no emissions
